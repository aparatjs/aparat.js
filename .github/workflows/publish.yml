name: Publish to npmjs.org & GitHub Packages

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # Setup Node.js
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check Node.js and npm
        run: |
          node --version
          npm --version
          which node
          which npm

      # -------------------------
      # Install dependencies
      # -------------------------
      - name: Install dependencies
        run: npm install

      # -------------------------
      # Build
      # -------------------------
      - name: Build package
        run: npm run build

      # ==================================================
      # Publish to npmjs.org
      # ==================================================

      - name: Setup npmjs registry
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Publish to npmjs.org
        run: npm publish --access public
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ==================================================
      # Prepare package for GitHub Packages
      # ==================================================

      - name: Save original package name
        run: |
          jq -r '.name' package.json > original_name.txt

      - name: Change package name for GitHub Packages
        run: |
          jq '.name = "@persian-caesar/aparat.js"' package.json > temp_package.json
          mv temp_package.json package.json

      # ==================================================
      # Publish to GitHub Packages
      # ==================================================

      - name: Setup GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com/"
          scope: "@persian-caesar"
          package-manager-cache: false

      - name: Publish to GitHub Packages
        run: npm publish
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      # ==================================================
      # Restore original package.json
      # ==================================================

      - name: Restore original package name
        if: always()
        run: |
          ORIGINAL_NAME=$(cat original_name.txt)

          jq --arg name "$ORIGINAL_NAME" \
            '.name = $name' \
            package.json > temp_package.json

          mv temp_package.json package.json

          rm -f original_name.txt
